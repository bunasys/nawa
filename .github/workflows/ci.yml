# Build and test on macOS and Linux. release.yml runs the same steps
# before it builds release binaries; keep the two in step.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # One run per branch / PR; a newer push to a PR cancels the older run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - uses: ./.github/actions/swift-build-cache
        with:
          platform: macos
      - run: swift build --build-tests
      - run: swift test --skip-build

  linux:
    name: Linux (amd64)
    runs-on: ubuntu-latest
    # Keep in step with release.yml (its static SDK must match this compiler).
    container: swift:6.4.1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - uses: ./.github/actions/swift-build-cache
        with:
          platform: linux
      - run: swift build --build-tests
      - run: swift test --skip-build
