# Build and test on macOS and Linux. Also called by release.yml before it
# builds release binaries.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # One run per branch / PR; a newer push cancels the older run.
  # Release runs (workflow_call) are keyed by their tag and never cancelled.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift build --build-tests
      - run: swift test --skip-build

  linux:
    name: Linux (amd64)
    runs-on: ubuntu-latest
    # Keep in step with release.yml (its static SDK must match this compiler).
    container: swift:6.4.1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift build --build-tests
      - run: swift test --skip-build
