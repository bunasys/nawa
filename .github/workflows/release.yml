# Push a tag `vX.Y.Z` on main to publish a release: on each platform the
# tests run, then the macOS arm64 and static Linux amd64 binaries are
# built, checked and attached to the GitHub release `vX.Y.Z` (created with generated notes,
# or added to if it already exists). The tag is the version: it is written
# into Sources/AgentACP/Version.swift before the build, and the check step
# makes sure `nawa --version` prints it.
# Run it by hand (Actions > Release > Run workflow) for a dry run: the same
# builds and checks, binaries kept as run artifacts (version "dev"),
# nothing published.
# After publishing, the formula in github.com/bunasys/homebrew-tap is
# updated (needs the HOMEBREW_TAP_TOKEN secret).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Each platform job tests and then builds on the same runner (the same
  # steps as ci.yml), so the release waits for a macOS runner only once.
  macos:
    name: Test and build macOS (arm64)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/swift-build-cache
        with:
          platform: macos
      - name: Stamp the version
        # The tag is the version: `nawa --version` prints what this writes.
        if: github.ref_type == 'tag'
        run: echo "let nawaVersion = \"${GITHUB_REF_NAME#v}\"" > Sources/AgentACP/Version.swift
      - name: Test
        run: swift build --build-tests && swift test --skip-build
      - name: Build
        run: swift build -c release --product nawa
      - name: Check
        run: |
          bin=.build/release/nawa
          version="$("$bin" --version | sed 's/^nawa //')"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match nawa --version ($version)"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":1}}'
          test "$(printf '%s\n' "$init" | "$bin" acp | grep -c '"result"')" = 1
      - name: Package
        run: |
          name="nawa-$VERSION-macos-arm64"
          mkdir -p stage dist
          cp .build/release/nawa README.md LICENSE stage/
          COPYFILE_DISABLE=1 tar czf "dist/$name.tar.gz" --uid 0 --gid 0 --uname root --gname root -C stage nawa README.md LICENSE
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: dist/*
          if-no-files-found: error

  linux:
    name: Test and build Linux (amd64, static)
    runs-on: ubuntu-latest
    # The Static Linux SDK below only works with this exact compiler.
    container: swift:6.4.1
    timeout-minutes: 45
    env:
      # Pinned by checksum: the file whose signature was checked against
      # swift.org's release key when this was set up.
      STATIC_SDK_URL: https://download.swift.org/swift-6.4.1-release/static-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
      STATIC_SDK_CHECKSUM: cef5592d7430ed3c5ae1ddda479849c6f5252bd94a5723db1559f984caf38a7c
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/swift-build-cache
        with:
          platform: linux
      - name: Stamp the version
        # The tag is the version: `nawa --version` prints what this writes.
        if: github.ref_type == 'tag'
        run: echo "let nawaVersion = \"${GITHUB_REF_NAME#v}\"" > Sources/AgentACP/Version.swift
      - name: Test
        run: swift build --build-tests && swift test --skip-build
      - name: Install the Static Linux SDK
        run: swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_CHECKSUM"
      - name: Build
        run: |
          swift build -c release --product nawa --swift-sdk x86_64-swift-linux-musl
          bin="$(swift build -c release --swift-sdk x86_64-swift-linux-musl --show-bin-path)/nawa"
          mkdir -p stage
          strip -o stage/nawa "$bin"
      - name: Check
        run: |
          bin=stage/nawa
          # Fully static: no interpreter, no shared libraries.
          if ldd "$bin" 2>/dev/null | grep -q '=>'; then ldd "$bin"; exit 1; fi
          version="$("$bin" --version | sed 's/^nawa //')"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match nawa --version ($version)"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":1}}'
          test "$(printf '%s\n' "$init" | timeout 10 "$bin" acp | grep -c '"result"')" = 1
      - name: Package
        run: |
          name="nawa-$VERSION-linux-amd64"
          mkdir -p dist
          cp README.md LICENSE stage/
          tar czf "dist/$name.tar.gz" --owner 0 --group 0 -C stage nawa README.md LICENSE
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [macos, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify checksums
        run: cd dist && sha256sum -c -- *.sha256
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
              --title "Nawa ${GITHUB_REF_NAME#v}" --generate-notes
          fi

  homebrew:
    name: Update the Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Push the new formula to bunasys/homebrew-tap
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # A fine-grained token with Contents read & write on
          # bunasys/homebrew-tap only: github.token can't push to another repo.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # The release is already out: a missing token shouldn't fail the run.
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set: the Homebrew tap was not updated"; exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --pattern '*.sha256' --dir sums
          macos_sha="$(cut -d ' ' -f 1 "sums/nawa-$version-macos-arm64.tar.gz.sha256")"
          linux_sha="$(cut -d ' ' -f 1 "sums/nawa-$version-linux-amd64.tar.gz.sha256")"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/bunasys/homebrew-tap.git" tap
          mkdir -p tap/Formula
          scripts/homebrew-formula.sh "$version" "$macos_sha" "$linux_sha" > tap/Formula/nawa.rb
          cd tap
          git add Formula/nawa.rb
          if git diff --cached --quiet; then echo "The formula is already up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "nawa $version"
          git push
